name: Actualizar estaciones EPW

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'   # Corre a las 06:00 UTC, el día 1 de cada mes

permissions:
  contents: write

concurrency:
  group: estaciones-epw
  cancel-in-progress: false

jobs:
  estaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generar los JSON de estaciones
        run: python3 actualizar_estaciones.py --todo
      - name: Guardar cambios
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add onebuilding.json energyplus.json cabeceras.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Actualizar estaciones EPW"
          git pull --rebase origin main
          git push
